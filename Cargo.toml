[package]
name = "shoclaw"
version = "0.1.0"
edition = "2021"
authors = ["sho"]
description = "Ultra-lightweight, customizable, modern minimalist browser built in Rust"

[dependencies]
tao = "0.37"
wry = "0.57"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
percent-encoding = "2.3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
