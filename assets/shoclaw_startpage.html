<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoclaw Start</title>
  <style>
    :root {
      --bg-deep: #080B16;
      --bg-surface: #0E0E12;
      --surface-glass: rgba(255, 255, 255, 0.05);
      --surface-glass-hover: rgba(255, 255, 255, 0.09);
      --surface-glass-active: rgba(255, 255, 255, 0.12);
      --border-specular: rgba(255, 255, 255, 0.14);
      --border-subtle: rgba(255, 255, 255, 0.06);
      --text-main: #E7E4F0;
      --text-muted: #ACA9B5;
      --text-dim: #76747F;
      --accent: #C5C2EE;
      --accent-rgb: 197, 194, 238;
      --ease: cubic-bezier(0.2, 0, 0, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      overflow-y: auto;
      user-select: none;
      -webkit-user-select: none;
    }

    .ambient-bg {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 32px;
      background:
        radial-gradient(ellipse 75% 55% at 50% -10%, rgba(44, 43, 89, 0.55), transparent 70%),
        radial-gradient(ellipse 55% 45% at 15% 85%, rgba(23, 21, 67, 0.45), transparent 65%),
        radial-gradient(ellipse 50% 40% at 85% 75%, rgba(30, 34, 62, 0.4), transparent 65%),
        var(--bg-deep);
    }

    /* Top bar */
    .top-bar {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }

    .clock-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .clock-time {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .clock-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
    }

    .clock-status {
      font-size: 13.5px;
      color: var(--text-muted);
    }

    /* Buttons & interactive primitives */
    button {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
    }

    .glass-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: var(--surface-glass);
      border: 1px solid var(--border-specular);
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 500;
      transition: background-color 160ms var(--ease), color 160ms var(--ease), border-color 160ms var(--ease);
    }

    .glass-btn:hover {
      background: var(--surface-glass-hover);
      color: var(--text-main);
      border-color: rgba(var(--accent-rgb), 0.35);
    }

    /* Quick settings popover */
    .popover-container {
      position: relative;
    }

    .popover {
      display: none;
      position: absolute;
      right: 0;
      top: 100%;
      margin-top: 8px;
      width: 240px;
      padding: 16px;
      border-radius: 14px;
      background: #141722;
      border: 1px solid var(--border-specular);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      flex-direction: column;
      gap: 12px;
      z-index: 50;
    }

    .popover.is-open {
      display: flex;
    }

    .popover-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
    }

    .popover-badge {
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-family: monospace;
      font-size: 11px;
      color: var(--accent);
    }

    /* Main Center Stack */
    .center-stack {
      width: 100%;
      max-width: 680px;
      margin: auto auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      padding: 32px 0;
    }

    /* Brand Header */
    .brand-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .brand-logo-card {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      border-top: 1px solid var(--border-specular);
      border-left: 1px solid var(--border-specular);
      border-right: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      transition: transform 200ms var(--ease);
    }

    .brand-logo-card:hover {
      transform: translateY(-2px);
    }

    .brand-logo-img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
    }

    .brand-wordmark {
      font-size: 32px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.6px;
    }

    /* Center Omnibar Search Bar */
    .search-section {
      width: 100%;
    }

    .search-pill {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      height: 52px;
      padding: 0 14px 0 10px;
      border-radius: 9999px;
      background: rgba(20, 23, 33, 0.88);
      border: 1px solid var(--border-specular);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      transition: border-color 180ms var(--ease), box-shadow 180ms var(--ease), transform 180ms var(--ease);
    }

    .search-pill:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.25), 0 20px 48px rgba(0, 0, 0, 0.5);
      transform: translateY(-1px);
    }

    .engine-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      flex-shrink: 0;
      transition: background-color 160ms var(--ease), color 160ms var(--ease);
    }

    .engine-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-main);
    }

    .search-input {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-size: 15px;
      color: var(--text-main);
      user-select: text;
      -webkit-user-select: text;
    }

    .search-input::placeholder {
      color: rgba(172, 169, 181, 0.65);
    }

    .kbd-shortcut {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      user-select: none;
    }

    /* Shortcuts Grid (2x4) */
    .shortcuts-section {
      width: 100%;
    }

    .shortcuts-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      width: 100%;
    }

    @media (max-width: 640px) {
      .shortcuts-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .shortcut-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 104px;
      padding: 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      border-top: 1px solid var(--border-specular);
      border-left: 1px solid var(--border-specular);
      border-right: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-main);
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      transition: transform 180ms var(--ease), background-color 180ms var(--ease), border-color 180ms var(--ease);
    }

    .shortcut-card:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(var(--accent-rgb), 0.35);
    }

    .shortcut-icon-box {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    .shortcut-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-main);
    }

    /* Add Shortcut Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-overlay.is-open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 380px;
      padding: 24px;
      border-radius: 18px;
      background: #141722;
      border: 1px solid var(--border-specular);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
    }

    .modal-input {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-specular);
      color: var(--text-main);
      font-size: 13.5px;
      outline: none;
    }

    .modal-input:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-secondary {
      padding: 8px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      font-size: 13px;
    }

    .btn-primary {
      padding: 8px 16px;
      border-radius: 8px;
      background: var(--accent);
      color: #0E0E12;
      font-size: 13px;
      font-weight: 600;
    }

    /* Bottom footer */
    .footer-bar {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-dim);
      font-size: 12px;
      z-index: 10;
    }
  </style>
</head>

      </form>
    </div>
  </div>

  <script>
    (function () {
      const clockEl = document.getElementById('shoclaw-clock');
      const statusEl = document.getElementById('shoclaw-status-text');
      const settingsBtn = document.getElementById('quick-settings-btn');
      const settingsPopover = document.getElementById('quick-settings-popover');
      const toggle24hBtn = document.getElementById('toggle-24h-btn');
      const popoverEngineLabel = document.getElementById('popover-engine-label');
      const searchForm = document.getElementById('shoclaw-search-form');
      const searchInput = document.getElementById('shoclaw-search-input');
      const engineBtn = document.getElementById('engine-switcher-btn');
      const addBtn = document.getElementById('add-shortcut-btn');
      const addModal = document.getElementById('add-modal');
      const cancelModalBtn = document.getElementById('cancel-modal-btn');
      const addForm = document.getElementById('add-shortcut-form');
      const shortcutsGrid = document.getElementById('shortcuts-grid');

      const engines = [
        { name: 'DuckDuckGo', url: 'https://duckduckgo.com/?q=' },
        { name: 'Brave', url: 'https://search.brave.com/search?q=' },
        { name: 'Google', url: 'https://www.google.com/search?q=' },
        { name: 'Bing', url: 'https://www.bing.com/search?q=' }
      ];

      let engineIndex = 0;
      let use24Hour = true;

      try {
        const stored24h = localStorage.getItem('shoclaw_24h');
        if (stored24h !== null) use24Hour = stored24h === 'true';
        const storedEngine = localStorage.getItem('shoclaw_engine');
        if (storedEngine !== null) engineIndex = parseInt(storedEngine, 10) % engines.length;
      } catch (e) {}

      function updateClock() {
        const now = new Date();
        const hours = now.getHours();
        let greeting = 'Good evening';
        if (hours < 12) greeting = 'Good morning';
        else if (hours < 18) greeting = 'Good afternoon';

        const timeStr = now.toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit',
          hour12: !use24Hour
        });
        const dateStr = now.toLocaleDateString([], {
          weekday: 'short',
          month: 'short',
          day: 'numeric'
        });

        clockEl.textContent = timeStr;
        statusEl.textContent = greeting + ' · ' + dateStr;
        toggle24hBtn.textContent = use24Hour ? 'ON' : 'OFF';
      }

      function updateEngineUI() {
        const cur = engines[engineIndex];
        engineBtn.setAttribute('title', 'Search engine: ' + cur.name + ' (click to cycle)');
        popoverEngineLabel.textContent = cur.name;
      }

      updateClock();
      updateEngineUI();
      setInterval(updateClock, 10000);

      // Keyboard navigation
      document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          searchInput.focus();
        } else if (e.key === 'Escape') {
          settingsPopover.classList.remove('is-open');
          addModal.classList.remove('is-open');
        }
      });

      settingsBtn.addEventListener('click', function () {
        settingsPopover.classList.toggle('is-open');
      });

      toggle24hBtn.addEventListener('click', function () {
        use24Hour = !use24Hour;
        try { localStorage.setItem('shoclaw_24h', String(use24Hour)); } catch (e) {}
        updateClock();
      });

      engineBtn.addEventListener('click', function () {
        engineIndex = (engineIndex + 1) % engines.length;
        try { localStorage.setItem('shoclaw_engine', String(engineIndex)); } catch (e) {}
        updateEngineUI();
      });

      function doNavigate(target) {
        if (window.ipc && typeof window.ipc.postMessage === 'function') {
          window.ipc.postMessage(JSON.stringify({ type: 'navigate', url: target }));
        } else {
          window.location.href = target;
        }
      }

      searchForm.addEventListener('submit', function (e) {
        e.preventDefault();
        const q = searchInput.value.trim();
        if (!q) return;

        const isUrl = /^(https?:\/\/)?([\w-]+\.)+[\w-]{2,}(\/.*)?$/i.test(q);
        if (isUrl) {
          const target = /^https?:\/\//i.test(q) ? q : 'https://' + q;
          doNavigate(target);
        } else {
          doNavigate(engines[engineIndex].url + encodeURIComponent(q));
        }
      });

      // Shortcut card clicks
      document.addEventListener('click', function (e) {
        const card = e.target.closest('[data-url]');
        if (card) {
          e.preventDefault();
          doNavigate(card.getAttribute('data-url'));
        }
      });

      addBtn.addEventListener('click', function () {
        addModal.classList.add('is-open');
        document.getElementById('shortcut-name-input').focus();
      });

      cancelModalBtn.addEventListener('click', function () {
        addModal.classList.remove('is-open');
      });

      addForm.addEventListener('submit', function (e) {
        e.preventDefault();
        const name = document.getElementById('shortcut-name-input').value.trim();
        const url = document.getElementById('shortcut-url-input').value.trim();
        if (!name || !url) return;

        const target = /^https?:\/\//i.test(url) ? url : 'https://' + url;
        const a = document.createElement('a');
        a.href = target;
        a.className = 'shortcut-card';
        a.setAttribute('data-url', target);
        a.innerHTML =
          '<span class="shortcut-icon-box" style="font-weight:600;font-size:15px;">' +
          name.charAt(0).toUpperCase() +
          '</span>' +
          '<span class="shortcut-label">' + name.replace(/</g, '&lt;') + '</span>';

        shortcutsGrid.insertBefore(a, addBtn);
        addForm.reset();
        addModal.classList.remove('is-open');
      });
    })();
  </script>
</body>
</html>
